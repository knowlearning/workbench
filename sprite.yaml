name: new sprite

sheet: /spritesheet.png
player: /sprite

# frames: [x, y, w, h, ox, oy]
# - rect is in sheet pixels: origin top-left, x right, y down
# - ox, oy REQUIRED, normalized within the frame [0..1]
frames:
  idle_0: [688, 100, 162, 168, 0.5117, 0.4665]
  idle_1: [770, 101, 154, 168, 0.5310585413345852, 0.5354741802203689]

  run_0: [513, 326, 166, 158, 0.5344377842249252, 0.9118186449274521]
  run_1: [682, 325, 166, 158, 0.49799289034935584, 0.9031219131721477]
  run_2: [867, 333, 158, 158, 0.4622526623518333, 0.8584766594744392]

  wobble_0: [430, 769, 189, 179, 0.6390361928729609, 0.8431623050719751]
  wobble_1: [620, 771, 155, 174, 0.5475855347046402, 0.8586154401626976]
  wobble_2: [775, 769, 157, 177, 0.486248057113634, 0.8581524812972382]
  wobble_3: [932, 769, 161, 176, 0.5011549806088282, 0.8630283476682453]
# states:
# - loop: "once" | "repeat" | "alternate" | N
#   - "once": play forward once, stop on last frame
#   - "repeat": loop forward infinitely
#   - "alternate": ping-pong infinitely (no duplicated endpoints)
#   - N (number): repeat forward exactly N times
# - sequence: [ [frameName, durationMs], ... ]
#   - duration is REQUIRED and in milliseconds (integer >= 0)
states:

  idle:
    loop: repeat
    sequence:
      - [idle_0, 250]
      - [idle_1, 250]

  run:
    loop: repeat
    sequence:
      - [run_0, 80]
      - [run_1, 80]
      - [run_2, 80]

  attack:
    loop: once
    sequence:
      - [run_0, 120]
      - [run_1, 100]
      - [run_2, 200]

  burst:
    loop: 3
    sequence:
      - [run_0, 50]
      - [run_1, 50]
      - [run_2, 50]

  wobble:
    loop: alternate
    sequence:
      - [wobble_0, 100]
      - [wobble_1, 100]
      - [wobble_2, 100]
      - [wobble_3, 100]
